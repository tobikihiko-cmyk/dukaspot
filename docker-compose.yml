name: dukaspot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dukaspot
      POSTGRES_USER: dukaspot
      POSTGRES_PASSWORD: dukaspot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukaspot -d dukaspot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://dukaspot:dukaspot@postgres:5432/dukaspot
      DUKASPOT_MERCHANT_ID: pilot-merchant
      LOG_LEVEL: info
    command: >
      sh -c "npm run migrate -w @dukaspot/database &&
             node apps/api/dist/main.js"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8787/api
    environment:
      API_PROXY_TARGET: http://api:8787
    depends_on:
      - api
    ports:
      - "5173:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dukaspot:dukaspot@postgres:5432/dukaspot
      REDIS_URL: redis://redis:6379
      DUKASPOT_MERCHANT_ID: pilot-merchant
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
